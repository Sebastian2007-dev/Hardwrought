plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	// Loom otherwise invents a new Player### name for every unauthenticated client launch. Since
	// offline UUIDs are derived from that name, every debug restart looked like a new player and the
	// correctly saved per-player knowledge appeared to be gone. Keep the development identity stable.
	runs {
		client {
			programArgs "--username", "Player573"
		}
	}

	mods {
		"hardwrought" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'hardwrought-test'
		enableGameTests = true
		enableClientGameTests = true
	}
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

/**
 * Automated client runs are played back by nobody, and at full volume they are played back loudly.
 * This drops the master volume in the run directories before a launch, creating options.txt if the
 * directory has none yet and leaving every other setting in it alone. Kept in the build rather than
 * in the file itself because both run directories are generated and are not in version control.
 */
def quietVolume = "0.05"
def quietRunDirectory = { File directory ->
    directory.mkdirs()
    File options = new File(directory, "options.txt")
    List<String> lines = options.exists() ? options.readLines("UTF-8") : []
    boolean written = false
    lines = lines.collect { line ->
        if (!line.startsWith("soundCategory_master:")) return line
        written = true
        return "soundCategory_master:" + quietVolume
    }
    if (!written) lines += "soundCategory_master:" + quietVolume
    options.withWriter("UTF-8") { writer -> lines.each { writer.writeLine(it) } }
}

tasks.register("quietTestRuns") {
    description = "Turns the master volume down in the generated client-test run directory."
    doLast {
        quietRunDirectory(file("build/run/clientGameTest"))
    }
}

tasks.configureEach { task ->
    if (task.name == "runClientGameTest") task.dependsOn("quietTestRuns")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	// Use a compatible compiler even when the IDE starts Gradle with Java 21.
	// Keep Java 25 usable in CI; this workstation has JDK 26 installed.
	toolchain {
		languageVersion = JavaLanguageVersion.of(
			JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)
				? JavaVersion.current().majorVersion.toInteger() : 26
		)
	}
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Minecraft must also run on the selected JDK, not the IDE's Gradle JVM.
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
